[agent]
  # Aggressive flushing for real-time data (500ms = 2Hz refresh rate)
  interval = "100ms"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "100ms"
  hostname = "telegraf"
  omit_hostname = true

###############################################################################
# INPUT: MQTT Consumer
# Real-time subscription to MQTT topics published by ESP32 and system monitor
###############################################################################
###############################################################################
# Temperature/Medical Data
###############################################################################
[[inputs.mqtt_consumer]]
  name_override = "medical_data"
  servers = ["tcp://mosquitto:1883"]
  topics = ["medical/#"]
  qos = 1
  persistent_session = true
  client_id = "telegraf-medical"
  data_format = "json"
  json_string_fields = []
  tag_keys = ["topic"]

###############################################################################
# System Metrics Data (CPU/RAM)
###############################################################################
[[inputs.mqtt_consumer]]
  name_override = "system"
  servers = ["tcp://mosquitto:1883"]
  topics = ["copilot/data/#"]
  qos = 1
  persistent_session = true
  client_id = "telegraf-system"
  data_format = "json"
  json_string_fields = []
  tag_keys = ["topic"]

###############################################################################
# OUTPUT: InfluxDB v2
# Store metrics for long-term analysis and querying
###############################################################################
[[outputs.influxdb_v2]]
  # Connect to InfluxDB (internal Docker network)
  urls = ["http://influxdb:8086"]
  
  # Authentication token
  token = "K_Rg0CMSrOTTlcm1OeHuKjxXseawPNzczs3FSPTzQMhuLpxq9-2ObKPkIPEczY5hDMAT4hYjjGPK5G5Y-ZQOEg=="
  
  # Organization and bucket for data storage
  organization = "BME"
  bucket = "iot"
  
  # Real-time flushing for immediate data availability
  flush_interval = "100ms"
